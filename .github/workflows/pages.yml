# Publishes the share page (site/index.html) to GitHub Pages on every push to main.
# One-time setup: Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Publish only the page, not the README or the sample script
      - name: Collect the page
        run: |
          test "$(wc -c < site/index.html)" -lt 4096 || { echo "site/index.html must stay under 4 KB"; exit 1; }
          mkdir _site
          cp site/index.html _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
