name: Hours
options:
  bundleIdPrefix: com.hoursapp
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # Entitlements go straight to codesign: through CODE_SIGN_ENTITLEMENTS,
    # Xcode refuses an app group without a provisioning profile. The Makefile
    # points this at team-prefixed copies when TEAM is set.
    HOURS_ENTITLEMENTS: $(SRCROOT)/Entitlements
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Hours:
    type: application
    platform: macOS
    sources:
      - path: Hours
      - path: Shared
    dependencies:
      - target: HoursWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoursapp.Hours
        OTHER_CODE_SIGN_FLAGS: --entitlements $(HOURS_ENTITLEMENTS)/Hours.entitlements
        PRODUCT_NAME: Hours
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hours
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
  HoursWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: HoursWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoursapp.Hours.Widget
        PRODUCT_NAME: HoursWidget
        INFOPLIST_FILE: HoursWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hours
        OTHER_CODE_SIGN_FLAGS: --entitlements $(HOURS_ENTITLEMENTS)/HoursWidget.entitlements
        SKIP_INSTALL: YES
  HoursTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HoursTests
    dependencies:
      - target: Hours
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoursapp.HoursTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hours.app/Contents/MacOS/Hours"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Hours:
    build:
      targets:
        Hours: all
        HoursTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HoursTests
